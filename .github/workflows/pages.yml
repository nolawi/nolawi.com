name: Build and deploy portfolio

on:
  push:
    branches: [main, "codex/publishing-system"]
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Refresh Medium articles
        run: python3 scripts/sync-medium.py || echo "::warning::Medium feed unavailable. Building with the checked-in articles."
      - name: Refresh Goodreads Read shelf
        env:
          GOODREADS_USER_ID: ${{ vars.GOODREADS_USER_ID }}
        run: python3 scripts/sync-goodreads.py || echo "::warning::Goodreads shelf unavailable. Building without the Books page."
      - name: Refresh GitHub contribution activity
        run: python3 scripts/sync-github-activity.py || echo "::warning::GitHub activity unavailable. Using the checked-in snapshot."
      - name: Refresh GitLab contribution activity
        run: python3 scripts/sync-gitlab-activity.py || echo "::warning::GitLab activity unavailable."
      - run: npm run build
        env:
          SITE_URL: ${{ github.ref == 'refs/heads/main' && vars.SITE_URL || '' }}
          SITE_INDEXABLE: ${{ github.ref == 'refs/heads/main' && vars.SITE_INDEXABLE || '0' }}
          SITE_ANALYTICS_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.SITE_ANALYTICS_TOKEN || '' }}
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: dist
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
