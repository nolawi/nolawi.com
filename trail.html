<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Switchback · Nolawi Petros</title>
<script>
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embedded");
</script>
<style>
:root { color-scheme: light; font: 100%/1.5 system-ui, sans-serif; color: #162c25; background: #f3eee0; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 42rem; padding: clamp(1rem, 5vw, 2.5rem); margin: auto; }
h1 { font: 500 clamp(1.85rem, 5vw, 2.5rem)/1.1 Georgia, serif; margin: 0; }
.embedded .trail-intro { display: none; }
.embedded main { padding-block: .5rem; }
fieldset { border: 0; padding: 0; margin: 1rem 0; min-inline-size: 0; }
legend { font-size: 1rem; font-weight: 700; margin-bottom: .5rem; }
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr)); gap: .5rem; }
.routes label { display: flex; align-items: center; gap: .4rem; min-height: 3rem; padding: .5rem; border: 2px solid #526e61; border-radius: .4rem; cursor: pointer; }
.routes label:has(:checked) { background: #ffe2a3; border-color: #162c25; }
.routes label:has(:focus-visible) { outline: 3px solid #914115; outline-offset: 2px; }
input { accent-color: #225140; }
.trail { display: flex; align-items: center; gap: .35rem; justify-content: space-between; list-style: none; background: #16392e; color: #fff8e8; margin: 1rem 0; padding: .6rem; border-radius: .5rem; }
.trail li { flex: 1; min-width: 0; border: 2px solid transparent; padding: .4rem .1rem; border-radius: .4rem; text-align: center; font-size: .875rem; }
.trail span { display: block; font-size: 1.55rem; }
.trail [aria-current="step"] { background: #ffe2a3; color: #162c25; border-color: #162c25; font-weight: 750; }
output { display: block; min-height: 3em; }
@media (forced-colors: active) {
  .routes label:has(:checked), .trail [aria-current="step"] { border-color: Highlight; }
}
</style>
</head>
<body>
<main>
<header class="trail-intro">
<h1>Switchback</h1>
<p>Pick a stop on an illustrated trail. Try the arrow keys once a stop has focus. Each choice gives you an icon, a name, and a clear selected state.</p>
</header>
<fieldset>
<legend>Choose a trail stop</legend>
<div class="routes">
<label><input type="radio" name="stop" value="0" checked> Trailhead</label>
<label><input type="radio" name="stop" value="1"> River bend</label>
<label><input type="radio" name="stop" value="2"> Lookout</label>
</div>
</fieldset>
<ol class="trail" aria-label="Trail map">
<li aria-current="step"><span aria-hidden="true">🚲</span>Trailhead</li>
<li><span aria-hidden="true">🛶</span>River bend</li>
<li><span aria-hidden="true">🏡</span>Lookout</li>
</ol>
<output id="trail-note">Trailhead. Grab your bike and follow the gravel road.</output>
</main>
<script>
const stops = Array.from(document.querySelectorAll('.trail li'));
const note = document.querySelector('#trail-note');
const notes = [
  'Trailhead. Grab your bike and follow the gravel road.',
  'River bend. Pull the kayak up on the bank and take a break.',
  'Lookout. Park by the cabin and enjoy the view.'
];
document.querySelector('fieldset').addEventListener('change', ({ target }) => {
  if (target.name !== 'stop') return;
  const selected = Number(target.value);
  stops.forEach((stop, index) => {
    if (index === selected) stop.setAttribute('aria-current', 'step');
    else stop.removeAttribute('aria-current');
  });
  note.value = notes[selected];
});
</script>
</body>
</html>
